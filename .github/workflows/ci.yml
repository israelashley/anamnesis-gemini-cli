# Hook syntax and lint, then the hooks against a stand-in server
# (tests/mock_server.py).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: bash -n and shellcheck
        run: |
          for f in hooks/*.sh bin/anamnesis bin/anamnesis-config; do
            bash -n "$f"
          done
          shellcheck -x -S warning hooks/*.sh bin/anamnesis bin/anamnesis-config

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: hook tests
        run: bash tests/test_hooks.sh
